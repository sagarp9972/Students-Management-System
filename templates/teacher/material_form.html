{% extends "base.html" %}
{% block title %}Upload Study Material · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-folder-open me-2"></i>Upload Study Material</h3>
<div class="card p-4">
<form method="POST" enctype="multipart/form-data">
  <div class="mb-3"><label class="form-label">Title</label><input name="title" class="form-control" placeholder="e.g. Unit 3 Notes" required></div>
  <div class="mb-3">
    <label class="form-label">Subject</label>
    <select name="subject_id" class="form-select" required>
      {% for s in subjects %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3"><label class="form-label">File (PDF)</label><input type="file" name="file" class="form-control" accept=".pdf"></div>
  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-upload me-1"></i>Upload</button>
  <a href="{{ url_for('teacher.materials_list') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
