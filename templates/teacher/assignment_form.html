{% extends "base.html" %}
{% block title %}Upload Assignment · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-file-pen me-2"></i>Upload Assignment</h3>
<div class="card p-4">
<form method="POST" enctype="multipart/form-data">
  <div class="mb-3"><label class="form-label">Title</label><input name="title" class="form-control" required></div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Subject</label>
      <select name="subject_id" class="form-select" required>
        {% for s in subjects %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6 mb-3"><label class="form-label">Due Date</label><input type="date" name="due_date" class="form-control"></div>
  </div>
  <div class="mb-3"><label class="form-label">Description (optional)</label><textarea name="description" class="form-control" rows="3"></textarea></div>
  <div class="mb-3"><label class="form-label">Attachment PDF (optional)</label><input type="file" name="attachment" class="form-control" accept=".pdf"></div>
  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Upload</button>
  <a href="{{ url_for('teacher.assignments_list') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
