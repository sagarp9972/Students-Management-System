{% extends "base.html" %}
{% block title %}Edit {{ dept.name }} Overview · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-pen me-2"></i>Edit {{ dept.name }} — Overview &amp; History</h3>
<div class="card p-4">
<form method="POST">
  <h6 class="section-title">Overview</h6>
  <div class="row">
    <div class="col-md-4 mb-3"><label class="form-label">Department Code</label><input name="code" class="form-control" value="{{ dept.code or '' }}"></div>
    <div class="col-md-4 mb-3"><label class="form-label">Established Year</label><input type="number" name="established_year" class="form-control" value="{{ dept.established_year or '' }}"></div>
    <div class="col-md-4 mb-3"><label class="form-label">Number of Laboratories</label><input type="number" name="num_labs" class="form-control" value="{{ dept.num_labs or 0 }}"></div>
  </div>
  <div class="mb-3"><label class="form-label">Vision</label><textarea name="vision" class="form-control" rows="2">{{ dept.vision or '' }}</textarea></div>
  <div class="mb-3"><label class="form-label">Mission</label><textarea name="mission" class="form-control" rows="2">{{ dept.mission or '' }}</textarea></div>
  <div class="mb-3"><label class="form-label">About Department</label><textarea name="about" class="form-control" rows="3">{{ dept.about or '' }}</textarea></div>
  <div class="mb-3"><label class="form-label">Objectives</label><textarea name="objectives" class="form-control" rows="2">{{ dept.objectives or '' }}</textarea></div>

  <h6 class="section-title">History</h6>
  <div class="mb-3"><label class="form-label">Growth Timeline</label><textarea name="growth_timeline" class="form-control" rows="2">{{ dept.growth_timeline or '' }}</textarea></div>
  <div class="mb-3"><label class="form-label">Major Achievements Summary</label><textarea name="achievements_summary" class="form-control" rows="2">{{ dept.achievements_summary or '' }}</textarea></div>
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Accreditation Details</label><input name="accreditation_details" class="form-control" value="{{ dept.accreditation_details or '' }}"></div>
    <div class="col-md-6 mb-3"><label class="form-label">University Affiliation</label><input name="university_affiliation" class="form-control" value="{{ dept.university_affiliation or '' }}"></div>
  </div>
  <div class="mb-3"><label class="form-label">Important Milestones</label><textarea name="milestones" class="form-control" rows="2">{{ dept.milestones or '' }}</textarea></div>

  <h6 class="section-title">Contact</h6>
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Contact Email</label><input type="email" name="contact_email" class="form-control" value="{{ dept.contact_email or '' }}"></div>
    <div class="col-md-6 mb-3"><label class="form-label">Contact Phone</label><input name="contact_phone" class="form-control" value="{{ dept.contact_phone or '' }}"></div>
  </div>
  <div class="mb-3"><label class="form-label">Address</label><input name="contact_address" class="form-control" value="{{ dept.contact_address or '' }}"></div>
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Office Hours</label><input name="office_hours" class="form-control" value="{{ dept.office_hours or '' }}"></div>
    <div class="col-md-6 mb-3"><label class="form-label">Google Map Embed URL (optional)</label><input name="map_embed_url" class="form-control" value="{{ dept.map_embed_url or '' }}"></div>
  </div>

  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Save</button>
  <a href="{{ url_for('department.detail', dept_id=dept.id) }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
