{% extends "base.html" %}
{% block title %}Add Placement Record · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-briefcase me-2"></i>Add Placement Record</h3>
<div class="card p-4" style="max-width:600px;">
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Student (optional)</label>
    <select name="student_id" class="form-select">
      <option value="">--</option>
      {% for s in students %}<option value="{{ s.id }}">{{ s.user.full_name }}</option>{% endfor %}
    </select>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Company</label><input name="company" class="form-control" required></div>
    <div class="col-md-3 mb-3"><label class="form-label">Package (₹)</label><input type="number" step="0.01" name="package" class="form-control"></div>
    <div class="col-md-3 mb-3"><label class="form-label">Year</label><input type="number" name="year" class="form-control"></div>
  </div>
  <div class="mb-3"><label class="form-label">Notes</label><input name="notes" class="form-control"></div>
  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Save</button>
  <a href="{{ url_for('department.detail', dept_id=dept.id) }}#placements" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
