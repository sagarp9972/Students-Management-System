{% extends "base.html" %}
{% block title %}Upload Document · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-file-arrow-up me-2"></i>Upload Document</h3>
<div class="card p-4" style="max-width:600px;">
<form method="POST" enctype="multipart/form-data">
  <div class="mb-3"><label class="form-label">Title</label><input name="title" class="form-control" required></div>
  <div class="mb-3">
    <label class="form-label">Category</label>
    <select name="category" class="form-select">
      {% for c in categories %}<option>{{ c }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3"><label class="form-label">File (PDF)</label><input type="file" name="file" class="form-control" accept=".pdf"></div>
  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-upload me-1"></i>Upload</button>
  <a href="{{ url_for('department.detail', dept_id=dept.id) }}#downloads" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
