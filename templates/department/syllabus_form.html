{% extends "base.html" %}
{% block title %}Edit Syllabus · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-file-pdf me-2"></i>{{ subject.name }} — Syllabus &amp; Outcomes</h3>
<div class="card p-4" style="max-width:600px;">
<form method="POST" enctype="multipart/form-data">
  <div class="mb-3"><label class="form-label">Syllabus PDF</label><input type="file" name="syllabus_file" class="form-control" accept=".pdf">
    {% if subject.syllabus_file %}<div class="small text-muted mt-1">Current: <a href="{{ url_for('static', filename=subject.syllabus_file) }}" target="_blank">view file</a></div>{% endif %}
  </div>
  <div class="mb-3"><label class="form-label">Course Outcomes</label><textarea name="outcomes" class="form-control" rows="4">{{ subject.outcomes or '' }}</textarea></div>
  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Save</button>
  <a href="{{ url_for('department.detail', dept_id=dept.id) }}#courses" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
