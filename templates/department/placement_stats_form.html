{% extends "base.html" %}
{% block title %}Edit Placement Stats · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-briefcase me-2"></i>Edit Placement Stats</h3>
<div class="card p-4" style="max-width:600px;">
<form method="POST">
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Highest Package (₹)</label><input type="number" step="0.01" name="highest_package" class="form-control" value="{{ dept.highest_package or '' }}"></div>
    <div class="col-md-6 mb-3"><label class="form-label">Average Package (₹)</label><input type="number" step="0.01" name="average_package" class="form-control" value="{{ dept.average_package or '' }}"></div>
  </div>
  <div class="mb-3"><label class="form-label">Recruiters (one per line)</label><textarea name="recruiters" class="form-control" rows="4">{{ dept.recruiters or '' }}</textarea></div>
  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Save</button>
  <a href="{{ url_for('department.detail', dept_id=dept.id) }}#placements" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
