{% extends "base.html" %}
{% block title %}{{ 'Edit' if notice else 'Add' }} Notice · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-bullhorn me-2"></i>{{ 'Edit' if notice else 'Add' }} Notice</h3>
<div class="card p-4">
<form method="POST">
  <div class="mb-3"><label class="form-label">Title</label><input name="title" class="form-control" value="{{ notice.title if notice else '' }}" required></div>
  <div class="mb-3"><label class="form-label">Content</label><textarea name="content" class="form-control" rows="4">{{ notice.content if notice else '' }}</textarea></div>
  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>{{ 'Update Notice' if notice else 'Post Notice' }}</button>
  <a href="{{ url_for('admin.notices_list') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
