{% extends "base.html" %}
{% block title %}{{ 'Edit' if event else 'Add' }} Event · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-calendar-days me-2"></i>{{ 'Edit' if event else 'Add' }} Event</h3>
<div class="card p-4">
<form method="POST">
  <div class="mb-3"><label class="form-label">Title</label><input name="title" class="form-control" value="{{ event.title if event else '' }}" required></div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Category</label>
      <select name="category" class="form-select">
        {% for c in categories %}<option {{ 'selected' if event and event.category==c }}>{{ c }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3"><label class="form-label">Date</label><input type="date" name="event_date" class="form-control" value="{{ event.event_date if event else '' }}"></div>
    <div class="col-md-4 mb-3"><label class="form-label">Location</label><input name="location" class="form-control" value="{{ event.location if event else '' }}"></div>
  </div>
  <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3">{{ event.description if event else '' }}</textarea></div>
  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Save Event</button>
  <a href="{{ url_for('admin.events_list') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
