{% extends "base.html" %}
{% block title %}{{ 'Edit' if employee else 'Add' }} Employee · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-user-tie me-2"></i>{{ 'Edit' if employee else 'Add' }} Employee</h3>
<div class="card p-4">
<form method="POST" enctype="multipart/form-data">
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Full Name</label>
      <input name="full_name" class="form-control" value="{{ employee.user.full_name if employee else '' }}" required>
    </div>
    {% if not employee %}
    <div class="col-md-4 mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required></div>
    {% endif %}
    <div class="col-md-4 mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" value="{{ employee.user.email if employee else '' }}" required>
    </div>
  </div>
  <div class="row">
    <div class="col-md-3 mb-3">
      <label class="form-label">Gender</label>
      <select name="gender" class="form-select">
        <option {{ 'selected' if employee and employee.user.gender=='Male' }}>Male</option>
        <option {{ 'selected' if employee and employee.user.gender=='Female' }}>Female</option>
        <option {{ 'selected' if employee and employee.user.gender=='Other' }}>Other</option>
      </select>
    </div>
    <div class="col-md-3 mb-3"><label class="form-label">Date of Birth</label><input type="date" name="dob" class="form-control" value="{{ employee.user.dob if employee else '' }}"></div>
    <div class="col-md-3 mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ employee.user.phone if employee else '' }}"></div>
    <div class="col-md-3 mb-3"><label class="form-label">Profile Photo</label><input type="file" name="photo" class="form-control"></div>
  </div>
  <div class="mb-3"><label class="form-label">Address</label><input name="address" class="form-control" value="{{ employee.address if employee else '' }}"></div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Department</label>
      <select name="department_id" class="form-select">
        <option value="">--</option>
        {% for d in departments %}<option value="{{ d.id }}" {{ 'selected' if employee and employee.department_id==d.id }}>{{ d.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Designation</label>
      <select name="designation" class="form-select">
        {% for d in designations %}<option {{ 'selected' if employee and employee.designation==d }}>{{ d }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3"><label class="form-label">Qualification</label><input name="qualification" class="form-control" value="{{ employee.qualification if employee else '' }}"></div>
  </div>
  <div class="row">
    <div class="col-md-3 mb-3"><label class="form-label">Experience (years)</label><input type="number" name="experience_years" class="form-control" min="0" value="{{ employee.experience_years if employee else '' }}"></div>
    <div class="col-md-3 mb-3"><label class="form-label">Date of Joining</label><input type="date" name="joining_date" class="form-control" value="{{ employee.joining_date if employee else '' }}"></div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Employment Type</label>
      <select name="employment_type" class="form-select">
        {% for t in employment_types %}<option {{ 'selected' if employee and employee.employment_type==t }}>{{ t }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Status</label>
      <select name="status" class="form-select">
        <option {{ 'selected' if employee and employee.status=='Active' }}>Active</option>
        <option {{ 'selected' if employee and employee.status=='Inactive' }}>Inactive</option>
      </select>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Salary (₹ / month) — admin only</label>
    <input type="number" name="salary" class="form-control" step="0.01" min="0" value="{{ employee.salary if employee else '' }}">
  </div>
  {% if not employee %}
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" placeholder="default: changeme123"></div>
    <div class="col-md-6 mb-3"><label class="form-label">Confirm Password</label><input type="password" name="confirm_password" class="form-control" placeholder="re-enter password"></div>
  </div>
  {% endif %}
  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Save Employee</button>
  <a href="{{ url_for('admin.employees_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
