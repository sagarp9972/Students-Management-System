{% extends "base.html" %}
{% block title %}{{ 'Edit' if student else 'Add' }} Student · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-user-graduate me-2"></i>{{ 'Edit' if student else 'Add' }} Student</h3>
<div class="card p-4">
<form method="POST" enctype="multipart/form-data">
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" name="full_name" class="form-control" value="{{ student.user.full_name if student else '' }}" required>
    </div>
    {% if not student %}
    <div class="col-md-4 mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required>
    </div>
    {% endif %}
    <div class="col-md-4 mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" value="{{ student.user.email if student else '' }}" required>
    </div>
  </div>
  <div class="row">
    <div class="col-md-3 mb-3">
      <label class="form-label">Gender</label>
      <select name="gender" class="form-select">
        <option {{ 'selected' if student and student.user.gender=='Male' }}>Male</option>
        <option {{ 'selected' if student and student.user.gender=='Female' }}>Female</option>
        <option {{ 'selected' if student and student.user.gender=='Other' }}>Other</option>
      </select>
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Date of Birth</label>
      <input type="date" name="dob" class="form-control" value="{{ student.user.dob if student else '' }}">
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Blood Group</label>
      <input type="text" name="blood_group" class="form-control" value="{{ student.blood_group if student else '' }}" placeholder="e.g. O+">
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Mobile</label>
      <input type="text" name="phone" class="form-control" value="{{ student.user.phone if student else '' }}">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Address</label>
    <input type="text" name="address" class="form-control" value="{{ student.address if student else '' }}">
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Parent Name</label>
      <input type="text" name="parent_name" class="form-control" value="{{ student.parent_name if student else '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Parent Phone</label>
      <input type="text" name="parent_phone" class="form-control" value="{{ student.parent_phone if student else '' }}">
    </div>
  </div>
  <div class="row">
    <div class="col-md-3 mb-3">
      <label class="form-label">Course</label>
      <select name="course_id" class="form-select">
        <option value="">--</option>
        {% for c in courses %}
        <option value="{{ c.id }}" {{ 'selected' if (student and student.course_id==c.id) or (not student and prefill_course_id == c.id) }}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Department</label>
      <select name="department_id" class="form-select">
        <option value="">--</option>
        {% for d in departments %}
        <option value="{{ d.id }}" {{ 'selected' if (student and student.department_id==d.id) or (not student and prefill_department_id == d.id) }}>{{ d.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Class / Section</label>
      <select name="class_group_id" class="form-select">
        <option value="">--</option>
        {% for cl in classes %}
        <option value="{{ cl.id }}" {{ 'selected' if student and student.class_group_id==cl.id }}>{{ cl.department.name }} · Sem {{ cl.semester }} · {{ cl.section }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Semester</label>
      <select name="semester" class="form-select">
        <option value="">--</option>
        {% for sem in range(1, 9) %}
        <option value="{{ sem }}" {{ 'selected' if (student and student.semester == sem) or (not student and prefill_semester == sem) }}>Semester {{ sem }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="row">
    <div class="col-md-3 mb-3">
      <label class="form-label">Admission Date</label>
      <input type="date" name="admission_date" class="form-control" value="{{ student.admission_date if student else '' }}">
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Status</label>
      <select name="status" class="form-select">
        <option {{ 'selected' if student and student.status=='Active' }}>Active</option>
        <option {{ 'selected' if student and student.status=='Inactive' }}>Inactive</option>
      </select>
    </div>
    {% if not student %}
    <div class="col-md-3 mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" placeholder="default: changeme123">
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Confirm Password</label>
      <input type="password" name="confirm_password" class="form-control" placeholder="re-enter password">
    </div>
    {% endif %}
    <div class="col-md-3 mb-3">
      <label class="form-label">Photo (optional)</label>
      <input type="file" name="photo" class="form-control">
    </div>
  </div>
  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Save Student</button>
  <a href="{{ url_for('admin.students_list') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
