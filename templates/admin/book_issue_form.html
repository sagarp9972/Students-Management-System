{% extends "base.html" %}
{% block title %}Issue Book · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-hand-holding me-2"></i>Issue Book</h3>
<div class="card p-4">
<form method="POST">
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Book</label>
      <select name="book_id" class="form-select" required>
        {% for b in books %}<option value="{{ b.id }}">{{ b.title }} ({{ b.available_copies }} available)</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Student</label>
      <select name="student_id" class="form-select" required>
        {% for s in students %}<option value="{{ s.id }}">{{ s.user.full_name }} ({{ s.student_code }})</option>{% endfor %}
      </select>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Issue Date</label><input type="date" name="issue_date" class="form-control"></div>
    <div class="col-md-6 mb-3"><label class="form-label">Due Date</label><input type="date" name="due_date" class="form-control" required></div>
  </div>
  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Issue Book</button>
  <a href="{{ url_for('admin.books_list') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
