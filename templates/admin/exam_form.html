{% extends "base.html" %}
{% block title %}{{ 'Edit' if exam else 'Add' }} Exam · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-file-signature me-2"></i>{{ 'Edit' if exam else 'Add' }} Exam</h3>
<div class="card p-4">
<form method="POST">
  <div class="mb-3"><label class="form-label">Exam Name</label><input name="name" class="form-control" value="{{ exam.name if exam else '' }}" placeholder="e.g. Mid-Semester Exam" required></div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Course</label>
      <select name="course_id" class="form-select" required>
        {% for c in courses %}<option value="{{ c.id }}" {{ 'selected' if exam and exam.course_id==c.id }}>{{ c.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Subject</label>
      <select name="subject_id" class="form-select">
        <option value="">--</option>
        {% for s in subjects %}<option value="{{ s.id }}" {{ 'selected' if exam and exam.subject_id==s.id }}>{{ s.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3"><label class="form-label">Exam Hall</label><input name="exam_hall" class="form-control" value="{{ exam.exam_hall if exam else '' }}" placeholder="e.g. Hall A"></div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Date</label><input type="date" name="exam_date" class="form-control" value="{{ exam.exam_date if exam else '' }}"></div>
    <div class="col-md-6 mb-3"><label class="form-label">Time</label><input type="time" name="exam_time" class="form-control" value="{{ exam.exam_time.strftime('%H:%M') if exam and exam.exam_time else '' }}"></div>
  </div>
  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Save Exam</button>
  <a href="{{ url_for('admin.exams_list') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
