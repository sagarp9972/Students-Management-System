{% extends "base.html" %}
{% block title %}Change Password · SMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h4 class="section-title">Change Password</h4>
      <form method="POST" novalidate>
        <div class="mb-3">
          <label class="form-label">Current Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="current_password" name="current_password" required>
            <span class="input-group-text pw-toggle" data-target="current_password"><i class="fa-solid fa-eye"></i></span>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="new_password" name="new_password" required minlength="6">
            <span class="input-group-text pw-toggle" data-target="new_password"><i class="fa-solid fa-eye"></i></span>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm New Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6">
            <span class="input-group-text pw-toggle" data-target="confirm_password"><i class="fa-solid fa-eye"></i></span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
