{% extends "base.html" %}
{% block title %}My Attendance · SMS{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="fa-solid fa-calendar-check me-2"></i>My Attendance</h3>
<div class="stat-card mb-4" style="max-width:260px;">
  <div class="card-value">{{ pct }}%</div>
  <div class="card-label">Overall Attendance</div>
</div>
<div class="table-responsive">
<table class="table table-hover align-middle">
  <thead><tr><th>Date</th><th>Subject</th><th>Status</th></tr></thead>
  <tbody>
    {% for r in records %}
    <tr>
      <td>{{ r.date }}</td>
      <td>{{ r.subject.name }}</td>
      <td><span class="badge badge-{{ r.status.lower() }}">{{ r.status }}</span></td>
    </tr>
    {% else %}
    <tr><td colspan="3" class="text-center text-muted py-4">No attendance records yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
